syntax = "proto3";

package ironfile.v1;

service FileBrowser {
  rpc OpenPath(OpenPathRequest) returns (BrowseResponse);
  rpc ListDirectory(ListDirectoryRequest) returns (stream FileEntry);
  rpc CreateThumbnail(ThumbnailRequest) returns (ThumbnailResponse);
  rpc InspectEntry(EntryInfoRequest) returns (EntryInfoResponse);
  rpc CopyEntries(FileCommandRequest) returns (FileCommandResponse);
  rpc DeleteEntries(DeleteEntriesRequest) returns (FileCommandResponse);
  rpc CreateSymlinks(FileCommandRequest) returns (FileCommandResponse);
  rpc CreateEntry(CreateEntryRequest) returns (FileCommandResponse);
  rpc RenameEntry(RenameEntryRequest) returns (FileCommandResponse);
  rpc CompressEntries(FileCommandRequest) returns (FileCommandResponse);
  rpc ExtractArchives(FileCommandRequest) returns (FileCommandResponse);
  rpc StreamLogs(LogStreamRequest) returns (stream LogEntry);
}

message LogStreamRequest {}

message LogEntry {
  string message = 1;
}

message OpenPathRequest {
  string path = 1;
  string thumbnail_directory = 2;
}

message FileEntry {
  string path = 1;
  string name = 2;
  bool is_directory = 3;
  string thumbnail_path = 4;
  bool is_symlink = 5;
  int64 modified_at = 6;
  int64 created_at = 7;
  bool directory_complete = 8;
  uint64 directory_enumeration_ms = 9;
  uint32 directory_entry_count = 10;
  uint64 entry_path_ms = 11;
  uint64 entry_symlink_ms = 12;
  uint64 entry_metadata_ms = 13;
  uint64 entry_timestamps_ms = 14;
}

message ThumbnailRequest {
  string path = 1;
  string thumbnail_directory = 2;
}

message ThumbnailResponse {
  string path = 1;
  string thumbnail_path = 2;
}

message EntryInfoRequest {
  string path = 1;
}

message EntryInfoField {
  string label = 1;
  string value = 2;
}

message EntryInfoResponse {
  string name = 1;
  repeated EntryInfoField fields = 2;
}

message FileCommandRequest {
  repeated string sources = 1;
  string destination = 2;
  int32 compression_level = 3;
  string compression_type = 4;
}

message FileCommandResponse {
  repeated string copied_paths = 1;
}

message DeleteEntriesRequest {
  repeated string paths = 1;
}

message CreateEntryRequest {
  string parent = 1;
  string name = 2;
  bool is_directory = 3;
}

message RenameEntryRequest {
  string path = 1;
  string name = 2;
}

message ListDirectoryRequest {
  string path = 1;
}

message Directory {
  repeated FileEntry entries = 1;
}

message FileContent {
  string content = 1;
}

message BrowserError {
  string message = 1;
}

message BrowseResponse {
  string path = 1;
  oneof payload {
    Directory directory = 2;
    FileContent file = 3;
    BrowserError error = 4;
  }
}
